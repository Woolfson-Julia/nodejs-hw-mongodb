type: object
required:
  - _id
  - phoneNumber
  - contactType
  - createdAt
  - updatedAt
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: John Doe
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: "+380505656565"
  email:
    description: "Contact's email"
    type: string
    example: john123@gmail.com
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
  isFavourite:
    description: 'Whether is contact favourite'
    type: boolean
    example: false
  userId:
    description: "Contact's user id"
    type: string
    example: 65e4decdd286b30065d54af9
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/uqwgdu/image/upload/image.png
  createdAt:
    type: string
    format: date-time
    description: Contact created at
    example: "2025-03-27T19:43:21.686+00:00"
  updatedAt:
    type: string
    format: date-time
    description: Contact updated at
    example: "2025-03-28T19:43:21.686+00:00"
